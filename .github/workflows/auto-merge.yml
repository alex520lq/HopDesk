name: Auto-merge passing HopDesk PRs

on:
  workflow_run:
    workflows:
      - Build HopDesk
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge successful build
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'pull_request' &&
          github.event.workflow_run.pull_requests[0].number != 0 &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR after successful build
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Do not merge drafts, closed PRs, or a PR whose head moved after this build.
          pr_state="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid)"
          state="$(jq -r '.state' <<< "$pr_state")"
          is_draft="$(jq -r '.isDraft' <<< "$pr_state")"
          head_sha="$(jq -r '.headRefOid' <<< "$pr_state")"

          if [[ "$state" != "OPEN" || "$is_draft" == "true" || "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo "Skip merge: PR is not open/ready or its head SHA changed."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$EXPECTED_SHA"
