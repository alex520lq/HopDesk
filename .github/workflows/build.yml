name: Build HopDesk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopdesk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-icons:
    name: Prepare committed app icons (one-time)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check committed icon assets
        id: icons
        shell: pwsh
        run: |
          if ((Test-Path assets/appicon/hopdesk.png) -and (Test-Path assets/appicon/hopdesk.ico)) {
            "missing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "missing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Set up Python for one-time icon generation
        if: steps.icons.outputs.missing == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate PNG and ICO once
        if: steps.icons.outputs.missing == 'true'
        shell: pwsh
        run: |
          python -m pip install Pillow
          python scripts/generate-app-icons.py
          if (!(Test-Path assets/appicon/hopdesk.png) -or !(Test-Path assets/appicon/hopdesk.ico)) {
            throw 'Icon generation did not produce both PNG and ICO assets.'
          }

      - name: Commit generated icon assets
        if: steps.icons.outputs.missing == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/appicon/hopdesk.png assets/appicon/hopdesk.ico
          git commit -m "Add pre-generated HopDesk app icons"
          git push

  windows:
    name: Windows build, tests and package (MSVC)
    needs: [prepare-icons]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Initialize Visual Studio x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows executable with MSVC (timed)
        shell: pwsh
        run: |
          $version = '0.5.0'
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          $env:HOPDESK_VERSION = $version
          $timer = [Diagnostics.Stopwatch]::StartNew()
          ./scripts/build-win.ps1 -Compiler msvc
          $timer.Stop()
          "Windows MSVC compile and link: $([math]::Round($timer.Elapsed.TotalSeconds, 2)) sec" | Tee-Object -FilePath build-timing.txt

      - name: Run portable core tests
        shell: pwsh
        run: ./scripts/test-core.ps1

      - name: Run file-transfer protocol tests
        shell: pwsh
        run: ./scripts/test-xfer-protocol.ps1

      - name: Run TCP loopback tests
        shell: pwsh
        run: ./scripts/test-network.ps1

      - name: Run native control/data role and reconnect integration tests
        shell: pwsh
        run: ./scripts/test-ha.ps1

      - name: Validate Windows updater script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/update-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Windows updater PowerShell syntax validation failed.'
          }

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-package | Out-Null
          Copy-Item build/hopdesk.exe build/windows-package/HopDesk.exe
          Compress-Archive -Path build/windows-package/* -DestinationPath build/HopDesk-Windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-windows
          path: build/HopDesk-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows timing
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-windows-timing
          path: build-timing.txt
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build, tests and package
    needs: [prepare-icons]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Build macOS app (timed)
        run: |
          VERSION=0.5.0
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')" ;;
          esac
          export HOPDESK_VERSION="$VERSION"
          start=$SECONDS
          sh scripts/build-mac.sh
          echo "macOS compile, bundle and signing: $((SECONDS-start)) sec" | tee build-timing.txt

      - name: Run portable core tests
        run: sh scripts/test-core.sh

      - name: Run file-transfer protocol tests
        run: sh scripts/test-xfer-protocol.sh

      - name: Run TCP loopback tests
        run: sh scripts/test-network.sh

      - name: Verify macOS app and shared branding
        run: |
          bash -n scripts/update-macos.command
          test -d build/HopDesk.app
          test -x build/HopDesk.app/Contents/MacOS/HopDesk
          plutil -lint build/HopDesk.app/Contents/Info.plist
          codesign --verify --deep --strict build/HopDesk.app
          test -s build/HopDesk.app/Contents/Resources/HopDesk.icns
          test -s build/HopDesk.app/Contents/Resources/hopdesk.png
          test -s build/HopDesk.app/Contents/Resources/update-macos.command
          test -s build/HopDesk-macOS.zip
          unzip -l build/HopDesk-macOS.zip | grep -q 'install-macos.command'
          unzip -l build/HopDesk-macOS.zip | grep -q 'update-macos.command'

      - name: Upload macOS install archive
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-macos
          path: build/HopDesk-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-macos-app
          path: build/HopDesk.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS timing
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-macos-timing
          path: build-timing.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish public update release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    concurrency:
      group: hopdesk-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: hopdesk-windows
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: hopdesk-macos
          path: release-assets

      - name: Generate versioned update manifest
        shell: bash
        run: |
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example v0.5.1)."
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          WIN_SHA="$(sha256sum release-assets/HopDesk-Windows.zip | cut -d ' ' -f 1)"
          MAC_SHA="$(sha256sum release-assets/HopDesk-macOS.zip | cut -d ' ' -f 1)"
          {
            echo "format=1"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "windows_url=https://github.com/alex520lq/HopDesk-Releases/releases/download/$TAG/HopDesk-Windows.zip"
            echo "windows_sha256=$WIN_SHA"
            echo "macos_url=https://github.com/alex520lq/HopDesk-Releases/releases/download/$TAG/HopDesk-macOS.zip"
            echo "macos_sha256=$MAC_SHA"
            echo "notes_url=https://github.com/alex520lq/HopDesk-Releases/releases/tag/$TAG"
          } > release-assets/latest.txt

      - name: Validate public release repository credentials
        env:
          RELEASE_TOKEN: ${{ secrets.HOPDESK_RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Create the public alex520lq/HopDesk-Releases repository and add HOPDESK_RELEASE_TOKEN (Contents: read/write) to this private repository's Actions secrets."
            exit 1
          fi

      - name: Guard existing version assets before publication
        env:
          GH_TOKEN: ${{ secrets.HOPDESK_RELEASE_TOKEN }}
        shell: bash
        run: |
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from update_manifest_policy import parse; from pathlib import Path; parse(Path("release-assets/latest.txt").read_text(encoding="utf-8"))'
          # A published tag is immutable. A partial/malformed release fails closed;
          # never overwrite assets before discovering a same-version hash change.
          status="$(curl --silent --show-error -o existing-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/alex520lq/HopDesk-Releases/releases/tags/$GITHUB_REF_NAME")"
          case "$status" in
            404) ;;
            200)
              curl --fail --location --silent --show-error \
                "https://github.com/alex520lq/HopDesk-Releases/releases/download/$GITHUB_REF_NAME/latest.txt" \
                -o published-version.txt
              python3 -c 'import sys; sys.path.insert(0,"scripts"); from update_manifest_policy import parse; from pathlib import Path; assert parse(Path("release-assets/latest.txt").read_text(encoding="utf-8")) == parse(Path("published-version.txt").read_text(encoding="utf-8")), "Published tag assets are immutable; use a new version"'
              ;;
            *) echo "::error::Cannot verify existing release (HTTP $status)."; exit 1 ;;
          esac
          git clone --depth 1 --branch main "https://x-access-token:$GH_TOKEN@github.com/alex520lq/HopDesk-Releases.git" release-repo
          python3 scripts/update_manifest_policy.py release-assets/latest.txt release-repo/latest.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          repository: alex520lq/HopDesk-Releases
          token: ${{ secrets.HOPDESK_RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          target_commitish: main
          files: |
            release-assets/HopDesk-Windows.zip
            release-assets/HopDesk-macOS.zip
            release-assets/latest.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update public latest manifest
        env:
          RELEASE_TOKEN: ${{ secrets.HOPDESK_RELEASE_TOKEN }}
        shell: bash
        run: |
          # Preflight already prepared a validated, monotonic local pointer.
          # Publish it only after both platform assets were uploaded successfully.
          cd release-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.txt
          if ! git diff --cached --quiet; then
            git commit -m "release: update latest HopDesk manifest"
            git push origin main
          fi
