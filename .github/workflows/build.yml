name: Build HopDesk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopdesk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build, tests and package (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Initialize Visual Studio x64 tools
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Windows executable with MSVC (timed)
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $version = $env:GITHUB_REF_NAME.Substring(1) }
          $env:HOPDESK_VERSION = $version
          $timer = [Diagnostics.Stopwatch]::StartNew()
          ./scripts/build-win.ps1 -Compiler msvc
          $timer.Stop()
          "Windows MSVC compile and link: $([math]::Round($timer.Elapsed.TotalSeconds, 2)) sec" | Tee-Object -FilePath build-timing.txt

      - name: Validate and smoke-test Windows memory profiler
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/profile-memory-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Windows memory profiler PowerShell syntax validation failed.'
          }
          $processId = $PID
          $processName = (Get-Process -Id $processId).ProcessName
          $output = Join-Path $env:TEMP 'hopdesk-memory-profiler-smoke.csv'
          ./scripts/profile-memory-windows.ps1 -ProcessId $processId -ProcessName $processName -IntervalSeconds 0.1 -DurationSeconds 1 -Output $output
          $samples = @(Import-Csv -LiteralPath $output)
          if ($samples.Count -lt 1 -or -not $samples[0].rss_mb -or -not $samples[0].private_mb -or -not $samples[0].vsz_mb) {
            throw 'Windows memory profiler smoke test did not produce valid samples.'
          }

      - name: Run portable core tests
        shell: pwsh
        run: ./scripts/test-core.ps1

      - name: Run file-transfer protocol tests
        shell: pwsh
        run: ./scripts/test-xfer-protocol.ps1

      - name: Run TCP loopback tests
        shell: pwsh
        run: ./scripts/test-network.ps1

      - name: Run native control/data role and reconnect integration tests
        shell: pwsh
        run: ./scripts/test-ha.ps1

      - name: Validate Windows updater script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/update-windows.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'Windows updater PowerShell syntax validation failed.'
          }

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows-package | Out-Null
          Copy-Item build/hopdesk.exe build/windows-package/HopDesk.exe
          Compress-Archive -Path build/windows-package/* -DestinationPath build/HopDesk-Windows.zip -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-windows
          path: build/HopDesk-Windows.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows timing
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-windows-timing
          path: build-timing.txt
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build, tests and package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Validate macOS memory profiler syntax
        run: bash -n scripts/profile-memory-macos.sh

      - name: Build macOS app (timed)
        run: |
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          case "$GITHUB_REF" in
            refs/tags/v*) VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')" ;;
          esac
          export HOPDESK_VERSION="$VERSION"
          start=$SECONDS
          sh scripts/build-mac.sh
          echo "macOS compile, bundle and signing: $((SECONDS-start)) sec" | tee build-timing.txt

      - name: Run portable core tests
        run: sh scripts/test-core.sh

      - name: Run file-transfer protocol tests
        run: sh scripts/test-xfer-protocol.sh

      - name: Run TCP loopback tests
        run: sh scripts/test-network.sh

      - name: Run macOS control and listener loopback tests
        run: python3 scripts/test-mac-connection.py

      - name: Run native macOS display command lifecycle tests
        run: sh scripts/test-mac-display.sh

      - name: Run native macOS receive and resume integration tests
        run: python3 scripts/test-mac-receive.py

      - name: Verify macOS app and shared branding
        run: |
          bash -n scripts/update-macos.command
          bash -n scripts/install-macos.command
          sh -n scripts/install-launchagent.command
          test -d build/HopDesk.app
          test -x build/HopDesk.app/Contents/MacOS/HopDesk
          plutil -lint build/HopDesk.app/Contents/Info.plist
          codesign --verify --deep --strict build/HopDesk.app
          test -s build/HopDesk.app/Contents/Resources/HopDesk.icns
          test -s build/HopDesk.app/Contents/Resources/hopdesk.png
          test -s build/HopDesk.app/Contents/Resources/update-macos.command
          test -s build/HopDesk-macOS.zip
          unzip -l build/HopDesk-macOS.zip | grep -q 'install-macos.command'
          unzip -l build/HopDesk-macOS.zip | grep -q 'update-macos.command'

      - name: Upload macOS install archive
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-macos
          path: build/HopDesk-macOS.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-macos-app
          path: build/HopDesk.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS timing
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-macos-timing
          path: build-timing.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish public update release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hopdesk-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: hopdesk-windows
          path: release-assets

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: hopdesk-macos
          path: release-assets

      - name: Generate versioned update manifest and release notes
        id: meta
        shell: bash
        run: |
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev\.[1-9][0-9]*)?$'; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (stable) or vMAJOR.MINOR.PATCH-dev.N (dev)."
            exit 1
          fi
          TAG="$GITHUB_REF_NAME"
          CHANNEL="stable"
          PRERELEASE="false"
          CHANNEL_FILE="stable.txt"
          case "$VERSION" in
            *-dev.*)
              CHANNEL="dev"
              PRERELEASE="true"
              CHANNEL_FILE="dev.txt"
              ;;
          esac
          python3 scripts/release_notes.py "$TAG" CHANGELOG.md release-assets/release-notes.md release-assets/summary.txt
          CTRL_PROTO="$(sed -n 's/^#define[[:space:]]\{1,\}HOP_CTRL_PROTO_VER[[:space:]]\{1,\}\([0-9][0-9]*\).*/\1/p' src/core/hop.h | head -n 1)"
          XFER_PROTO="$(sed -n 's/^#define[[:space:]]\{1,\}HOP_XFER_PROTO_VER[[:space:]]\{1,\}\([0-9][0-9]*\).*/\1/p' src/core/hop.h | head -n 1)"
          SUMMARY="$(tr -d '\r\n' < release-assets/summary.txt)"
          WIN_SHA="$(sha256sum release-assets/HopDesk-Windows.zip | cut -d ' ' -f 1)"
          MAC_SHA="$(sha256sum release-assets/HopDesk-macOS.zip | cut -d ' ' -f 1)"
          {
            echo "format=2"
            echo "channel=$CHANNEL"
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "ctrl_proto=$CTRL_PROTO"
            echo "xfer_proto=$XFER_PROTO"
            echo "windows_url=https://github.com/alex520lq/HopDesk/releases/download/$TAG/HopDesk-Windows.zip"
            echo "windows_sha256=$WIN_SHA"
            echo "macos_url=https://github.com/alex520lq/HopDesk/releases/download/$TAG/HopDesk-macOS.zip"
            echo "macos_sha256=$MAC_SHA"
            echo "notes_url=https://github.com/alex520lq/HopDesk/releases/tag/$TAG"
            if [ -n "$SUMMARY" ]; then
              echo "summary=$SUMMARY"
            fi
          } > release-assets/manifest.txt
          cp release-assets/manifest.txt "release-assets/$CHANNEL_FILE"
          if [ "$CHANNEL" = "stable" ]; then
            {
              echo "format=1"
              echo "version=$VERSION"
              echo "tag=$TAG"
              echo "windows_url=https://github.com/alex520lq/HopDesk/releases/download/$TAG/HopDesk-Windows.zip"
              echo "windows_sha256=$WIN_SHA"
              echo "macos_url=https://github.com/alex520lq/HopDesk/releases/download/$TAG/HopDesk-macOS.zip"
              echo "macos_sha256=$MAC_SHA"
              echo "notes_url=https://github.com/alex520lq/HopDesk/releases/tag/$TAG"
            } > release-assets/latest.txt
          fi
          {
            echo "channel=$CHANNEL"
            echo "prerelease=$PRERELEASE"
            echo "channel_file=$CHANNEL_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Guard existing version assets before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          CHANNEL_FILE: ${{ steps.meta.outputs.channel_file }}
        shell: bash
        run: |
          python3 -c 'import sys; sys.path.insert(0,"scripts"); from update_manifest_policy import parse; from pathlib import Path; parse(Path("release-assets/manifest.txt").read_text(encoding="utf-8"))'
          # A published tag is immutable. A partial/malformed release fails closed;
          # never overwrite assets before discovering a same-version hash change.
          status="$(curl --silent --show-error -o existing-release.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/alex520lq/HopDesk/releases/tags/$GITHUB_REF_NAME")"
          case "$status" in
            404) ;;
            200)
              if ! curl --fail --location --silent --show-error \
                "https://github.com/alex520lq/HopDesk/releases/download/$GITHUB_REF_NAME/manifest.txt" \
                -o published-version.txt; then
                curl --fail --location --silent --show-error \
                  "https://github.com/alex520lq/HopDesk/releases/download/$GITHUB_REF_NAME/latest.txt" \
                  -o published-version.txt
              fi
              python3 -c 'import sys; sys.path.insert(0,"scripts"); from update_manifest_policy import parse; from pathlib import Path; assert parse(Path("release-assets/manifest.txt").read_text(encoding="utf-8")) == parse(Path("published-version.txt").read_text(encoding="utf-8")), "Published tag assets are immutable; use a new version"'
              ;;
            *) echo "::error::Cannot verify existing release (HTTP $status)."; exit 1 ;;
          esac
          REPO_URL="https://x-access-token:$GH_TOKEN@github.com/alex520lq/HopDesk.git"
          if git ls-remote --exit-code --heads "$REPO_URL" updates >/dev/null 2>&1; then
            git clone --depth 1 --branch updates "$REPO_URL" release-repo
          else
            mkdir -p release-repo
            git -C release-repo init -b updates
            git -C release-repo remote add origin "$REPO_URL"
          fi
          python3 scripts/update_manifest_policy.py "release-assets/$CHANNEL_FILE" "release-repo/$CHANNEL_FILE"
          if [ "$CHANNEL" = "stable" ]; then
            python3 scripts/update_manifest_policy.py release-assets/latest.txt release-repo/latest.txt
          fi

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body_path: release-assets/release-notes.md
          files: |
            release-assets/HopDesk-Windows.zip
            release-assets/HopDesk-macOS.zip
            release-assets/manifest.txt
            release-assets/${{ steps.meta.outputs.channel_file }}
          fail_on_unmatched_files: true

      - name: Update public channel manifest
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
          CHANNEL_FILE: ${{ steps.meta.outputs.channel_file }}
        shell: bash
        run: |
          # Preflight already prepared a validated, monotonic local pointer.
          # Publish it only after both platform assets were uploaded successfully.
          cd release-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHANNEL_FILE"
          if [ "$CHANNEL" = "stable" ]; then
            git add latest.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "release: update $CHANNEL HopDesk manifest ($GITHUB_REF_NAME)"
            git push origin updates
          fi
