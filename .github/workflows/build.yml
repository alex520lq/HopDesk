name: Build HopDesk

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopdesk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: hopdesk-windows
          - os: macos-latest
            artifact: hopdesk-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MinGW GCC
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-win.ps1 -Compiler gcc

      - name: Build macOS executable
        if: runner.os == 'macOS'
        run: sh scripts/build-mac.sh

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/hopdesk.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/hopdesk
          if-no-files-found: error
          retention-days: 14
