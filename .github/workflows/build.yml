name: Build HopDesk

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopdesk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MinGW GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build Windows executable
        shell: pwsh
        run: ./scripts/build-win.ps1 -Compiler gcc

      - name: Run portable core tests
        shell: pwsh
        run: ./scripts/test-core.ps1

      - name: Run TCP loopback tests
        shell: pwsh
        run: ./scripts/test-network.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-windows
          path: build/hopdesk.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build and tests
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build macOS executable
        run: sh scripts/build-mac.sh

      - name: Run portable core tests
        run: sh scripts/test-core.sh

      - name: Run TCP loopback tests
        run: sh scripts/test-network.sh

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: hopdesk-macos
          path: build/hopdesk
          if-no-files-found: error
          retention-days: 14
